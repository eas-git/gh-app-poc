on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Compare commits (code-change detection)
        run: gh api repos/${{ github.repository }}/compare/main...main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Post PR/issue comment
        run: gh api repos/${{ github.repository }}/issues/1/comments -f body="test comment from GH App"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Dispatch another workflow
        run: gh api repos/${{ github.repository }}/actions/workflows/target-dispatch.yml/dispatches -f ref=main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: List workflow runs (metrics collection)
        run: gh api repos/${{ github.repository }}/actions/runs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create environment
        run: gh api --method PUT repos/${{ github.repository }}/environments/test-env
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set required status check (branch protection)
        run: |
          cat <<'EOF' | gh api --method PUT repos/${{ github.repository }}/branches/main/protection --input -
          {
            "required_status_checks": { "strict": true, "contexts": ["some-check"] },
            "enforce_admins": true,
            "required_pull_request_reviews": null,
            "restrictions": null
          }
          EOF
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
